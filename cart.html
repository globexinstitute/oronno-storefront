<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Bag | Oronno Fashion</title>
  <meta name="description" content="Review your selected Pakistani dresses, apply promotional vouchers, calculate shipping, and proceed to secure checkout.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    .cart-page-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2.5rem;
      padding-block: 3rem 5rem;
    }
    @media (min-width: 992px) {
      .cart-page-layout {
        grid-template-columns: 1.8fr 1.1fr;
      }
    }
    .cart-table-wrap {
      background: var(--color-white);
      border: 1px solid var(--color-border);
      padding: 1.5rem;
    }
    .cart-row {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 1.25rem;
      padding-block: 1.25rem;
      border-bottom: 1px solid var(--color-border);
      align-items: center;
    }
    .cart-row:last-child {
      border-bottom: none;
    }
    .cart-item-thumb {
      width: 80px;
      height: 105px;
      object-fit: cover;
      background: var(--color-cream);
    }
    .cart-item-info h4 {
      font-size: 1rem;
      margin-bottom: 0.25rem;
      color: var(--color-burgundy);
    }
    .cart-item-info p {
      font-size: 0.8rem;
      color: var(--color-text-muted);
    }
    .cart-qty-ctrl {
      display: inline-flex;
      border: 1px solid var(--color-border);
      margin-top: 0.5rem;
    }
    .cart-qty-ctrl button {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cart-qty-ctrl input {
      width: 36px;
      text-align: center;
      border: none;
      font-size: 0.85rem;
      outline: none;
    }
    .cart-item-price {
      text-align: right;
      font-weight: 600;
      color: var(--color-burgundy);
      font-size: 1.05rem;
    }
    .cart-remove-link {
      display: block;
      color: var(--color-error);
      font-size: 0.75rem;
      margin-top: 0.5rem;
      text-decoration: underline;
      cursor: pointer;
    }
    .summary-card {
      background: var(--color-cream-soft);
      border: 1px solid var(--color-border);
      padding: 2rem;
      height: fit-content;
    }
    .summary-title {
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--color-border);
    }
    .summary-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.85rem;
      font-size: 0.9rem;
    }
    .summary-line.total {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-burgundy);
      border-top: 1px solid var(--color-border);
      padding-top: 1rem;
      margin-top: 1rem;
    }
    .coupon-box {
      display: flex;
      gap: 0.5rem;
      margin-block: 1.5rem;
    }
    .coupon-box input {
      flex: 1;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--color-border);
      font-size: 0.85rem;
      text-transform: uppercase;
      outline: none;
    }
    .delivery-radio-group {
      margin-block: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.85rem;
    }
    .delivery-radio-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }
    .delivery-radio-label input {
      accent-color: var(--color-burgundy);
    }
  </style>
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="site-main">
    <div class="container">
      <div style="padding-top: 2.5rem; text-align: center;">
        <span class="text-gold" style="font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase;">Review Selections</span>
        <h1 class="font-serif" style="font-size: 2.4rem; margin-top: 0.35rem;">Your Shopping Bag</h1>
      </div>

      <div class="cart-page-layout">
        <!-- Cart Items List -->
        <div>
          <div class="cart-table-wrap" id="cart-items-container">
            <p style="text-align: center; color: var(--color-text-muted); padding: 2rem;">Loading bag contents...</p>
          </div>
          <div style="margin-top: 1.5rem; display: flex; justify-content: space-between;">
            <a href="collection.html" class="btn btn-outline">← Continue Shopping</a>
          </div>
        </div>

        <!-- Order Summary & Delivery Selector -->
        <div>
          <div class="summary-card">
            <h3 class="summary-title font-serif">Order Summary</h3>
            
            <div class="summary-line">
              <span>Bag Subtotal</span>
              <span id="summary-subtotal">৳0</span>
            </div>

            <div class="summary-line" id="discount-line" style="display: none; color: var(--color-success);">
              <span>Festive Discount (<span id="discount-code-tag"></span>)</span>
              <span id="summary-discount">-৳0</span>
            </div>

            <div style="margin-top: 1rem;">
              <label style="font-size: 0.85rem; font-weight: 600;">Delivery Zone:</label>
              <div class="delivery-radio-group">
                <label class="delivery-radio-label">
                  <input type="radio" name="delivery-zone" value="inside-dhaka" checked onchange="updateDeliveryFee(80)">
                  <span>Inside Dhaka (৳80)</span>
                </label>
                <label class="delivery-radio-label">
                  <input type="radio" name="delivery-zone" value="outside-dhaka" onchange="updateDeliveryFee(150)">
                  <span>Outside Dhaka (৳150)</span>
                </label>
              </div>
            </div>

            <div class="summary-line">
              <span>Estimated Shipping</span>
              <span id="summary-delivery">৳80</span>
            </div>

            <div class="coupon-box">
              <input type="text" id="coupon-code-input" placeholder="COUPON (TRY ORONNO10)">
              <button type="button" class="btn btn-outline" onclick="handleCouponApply()">Apply</button>
            </div>
            <div id="coupon-status" style="font-size: 0.8rem; margin-top: -1rem; margin-bottom: 1rem; display: none;"></div>

            <div class="summary-line total">
              <span>Grand Total</span>
              <span id="summary-grand-total">৳0</span>
            </div>

            <a href="checkout.html" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; text-align: center;">
              Proceed to Checkout
            </a>

            <div style="text-align: center; margin-top: 1rem;">
              <span style="font-size: 0.78rem; color: var(--color-text-muted);">
                🔒 Cash on Delivery available across all 64 districts
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

  <script>
    let deliveryFee = 80;
    let discountAmount = 0;
    let subtotal = 0;

    document.addEventListener("DOMContentLoaded", async () => {
      await renderCartPage();
    });

    async function renderCartPage() {
      const cart = await API.getCart();
      const container = document.getElementById("cart-items-container");
      subtotal = cart.subtotal;

      if (!cart.items || cart.items.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 4rem 1rem;">
            <p style="color: var(--color-text-muted); font-size: 1.1rem; margin-bottom: 1.5rem;">Your shopping bag is empty.</p>
            <a href="collection.html" class="btn btn-primary">Discover Dresses</a>
          </div>
        `;
        document.getElementById("summary-subtotal").textContent = "৳0";
        document.getElementById("summary-grand-total").textContent = "৳0";
        return;
      }

      container.innerHTML = cart.items.map(item => `
        <div class="cart-row">
          <img src="${item.product?.images[0] || 'images/products/placeholder.jpg'}" alt="${item.product?.name}" class="cart-item-thumb">
          <div class="cart-item-info">
            <span style="font-size: 0.72rem; text-transform: uppercase; color: var(--color-gold);">${item.product?.category}</span>
            <h4>${item.product?.name || 'Dress'}</h4>
            <p>Size: <strong>${item.size}</strong> | Color: ${item.color}</p>
            <div class="cart-qty-ctrl">
              <button onclick="changeQty('${item.sku}', ${item.quantity - 1})">-</button>
              <input type="text" value="${item.quantity}" readonly>
              <button onclick="changeQty('${item.sku}', ${item.quantity + 1})">+</button>
            </div>
            <span class="cart-remove-link" onclick="changeQty('${item.sku}', 0)">Remove Item</span>
          </div>
          <div class="cart-item-price">
            ৳${item.itemTotal.toLocaleString()}
          </div>
        </div>
      `).join("");

      calculateTotals();
    }

    async function changeQty(sku, qty) {
      await API.updateCart(sku, qty);
      await renderCartPage();
      window.dispatchEvent(new CustomEvent("oronno:cartupdated"));
    }

    function updateDeliveryFee(fee) {
      deliveryFee = fee;
      document.getElementById("summary-delivery").textContent = `৳${fee}`;
      calculateTotals();
    }

    async function handleCouponApply() {
      const code = document.getElementById("coupon-code-input").value;
      const status = document.getElementById("coupon-status");
      try {
        const res = await API.validateCoupon(code);
        discountAmount = Math.round((subtotal * res.discountPercent) / 100);
        status.style.display = "block";
        status.style.color = "var(--color-success)";
        status.textContent = `✓ ${res.message} (-৳${discountAmount})`;
        document.getElementById("discount-line").style.display = "flex";
        document.getElementById("discount-code-tag").textContent = res.code;
        document.getElementById("summary-discount").textContent = `-৳${discountAmount}`;
        calculateTotals();
      } catch (err) {
        status.style.display = "block";
        status.style.color = "var(--color-error)";
        status.textContent = err.message;
      }
    }

    function calculateTotals() {
      document.getElementById("summary-subtotal").textContent = `৳${subtotal.toLocaleString()}`;
      const grandTotal = Math.max(0, subtotal - discountAmount + deliveryFee);
      document.getElementById("summary-grand-total").textContent = `৳${grandTotal.toLocaleString()}`;
      sessionStorage.setItem("oronno_selected_delivery_fee", deliveryFee);
      sessionStorage.setItem("oronno_discount_amount", discountAmount);
    }
  </script>
</body>
</html>
